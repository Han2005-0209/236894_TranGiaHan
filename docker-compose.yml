services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: trangiahan2005/backend:latest
    container_name: food-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-236894_TranGiaHan}
      - CORS_ORIGIN=*

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: trangiahan2005/frontend:latest
    container_name: food-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
