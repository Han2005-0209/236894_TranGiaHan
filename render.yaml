services:
  # Backend API Service
  - type: web
    name: api-236894
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGODB_DB_NAME
        value: 236894_TranGiaHan
      - key: CORS_ORIGIN
        value: "*"
      - key: MONGODB_URI
        sync: false

  # Frontend Web Service (Static Site)
  - type: web
    name: web-236894
    env: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://api-236894.onrender.com
